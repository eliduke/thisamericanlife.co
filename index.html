---
layout: default
description: a fan edit of thisamericanlife.org
pagination:
  enabled: true
---

<div id="index">
  <form action="/search.html" method="get">
    <input
      id="search-box"
      type="search"
      name="query"
      class="form-control form-control-lg my-4"
      placeholder="search -> type and then hit enter">
  </form>

  {% for episode in paginator.posts %}
    <div class="episode mb-4">
      <a href="{{episode.id}}">
        <h2 class="mt-0 pt-0">{{episode.title}}</h2>
        <p class="text-dark-emphasis fst-italic">#{{episode.number}} - {{episode.date | date: "%-d %B %Y"}}</p>
        <img class="img-fluid my-3" src="{{site.assets}}/images/{{episode.slug}}.jpg">
        <p class="text-dark-emphasis fs-5 mb-4">{{episode.description}}</p>
      </a>
    </div>
  {% endfor %}
</div>
